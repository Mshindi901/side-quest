version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: dad_farm_db
    restart: always
    environment:
      POSTGRES_DB: poultry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yugah2005@
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poultry"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend API Service
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: dad_farm_backend
    restart: always
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: poultry
      DB_USER: postgres
      DB_PASSWORD: yugah2005@
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  # 3. Frontend Dashboard Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dad_farm_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:

